<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flotte Aeron — Chargement</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fond plein écran : screenshots en rotation (fondu opacity uniquement, léger).
       Les <img> sont en dur dans le HTML (pas créées en JS) pour que la première
       image s'affiche même si le moteur de rendu du jeu a un souci avec le JS. -->
  <div class="bg-slides" id="bg-slides">
    <img class="bg-slide is-active" src="assets/img/backgrounds/1.jpg" alt="">
    <img class="bg-slide" src="assets/img/backgrounds/2.jpg" alt="">
    <img class="bg-slide" src="assets/img/backgrounds/3.jpg" alt="">
    <img class="bg-slide" src="assets/img/backgrounds/4.jpg" alt="">
  </div>
  <div class="bg-scrim"></div>

  <!-- Haut gauche : serveur (nom transmis par GMod, aucune dépendance externe) -->
  <div class="hud hud-server">
    <span class="status-dot"></span>
    <div class="hud-server-text">
      <span class="hud-label">Serveur</span>
      <span class="hud-value" id="server-name">Flotte Aeron</span>
    </div>
  </div>

  <!-- Haut droite : carte du serveur -->
  <div class="hud hud-map">
    <span class="hud-label">Carte</span>
    <span class="hud-value" id="map-name">—</span>
  </div>

  <!-- Centre : identité + progression -->
  <main class="center-stack">
    <img class="logo" src="assets/img/logo.png" alt="Aeron">
    <h1 class="brand-title">Flotte Aeron</h1>
    <span class="brand-sub">Clone Wars Roleplay</span>

    <div class="loading-block">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="loading-row">
        <span class="loading-label" id="loading-status">Initialisation…</span>
        <span class="loading-percent"><span id="percent-value">0</span>%</span>
      </div>
    </div>

    <p class="tip-text" id="tip-text">Chargement des données de la flotte…</p>
  </main>

  <!-- Bas gauche : liens (non cliquables, informatif) -->
  <div class="hud hud-links">
    <span class="link-tag" id="link-discord">discord.gg/Ym5dPXkBTW</span>
    <span class="link-tag" id="link-web">###</span>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
